global:
  resolve_timeout: 5m

route:
  receiver: telegram

receivers:

  - name: telegram

    telegram_configs:

      - bot_token: 'YOUR_TELEGRAM_BOT_TOKEN'

        chat_id: YOUR_TELEGRAM_CHAT_ID

        message: |
          🚨 Alert: {{ .CommonLabels.alertname }}

          Instance: {{ .CommonLabels.instance }}

          Severity: {{ .CommonLabels.severity }}

          Description:
          {{ .CommonAnnotations.description }}
